name = "brainy-bees-registration"
main = "workers/registration.js"
compatibility_date = "2024-01-01"

# KV Namespace for storing form submissions
# This is the SAME namespace used by the old camp registration form —
# reusing it keeps all prior data and avoids creating a duplicate resource.
# If you ever need to recreate it: wrangler kv:namespace create "REGISTRATIONS"
[[kv_namespaces]]
binding = "REGISTRATIONS"
id = "YOUR_KV_NAMESPACE_ID_HERE"

# Environment variables (set secrets with: wrangler secret put RESEND_API_KEY)
[vars]
ENVIRONMENT = "production"

# Cloudflare Pages config
[site]
bucket = "./dist"

# Routes - worker handles /api/* paths on the CORRECT domain (brainybee.ca)
[[routes]]
pattern = "brainybee.ca/api/*"
zone_name = "brainybee.ca"
